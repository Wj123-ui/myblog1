<header class="site-header" role="banner">
  <div class="header-container">
    <a href="{{ '/' | relative_url }}" class="site-title" aria-label="返回首页">
      <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M13.5,2 L8.5,13 L11,13 L9.5,22 L17.5,10 L14.5,10 L17.5,2 Z"/>
        </svg>
      </span>
      <span class="title-text">{{ site.title }}</span>
    </a>

    <nav class="desktop-nav" aria-label="主导航">
      <ul class="nav-list">
        <li><a href="{{ '/' | relative_url }}" class="nav-link" {% if page.url == '/' or page.url == '/index.html' %}aria-current="page"{% endif %}>首页</a></li>
        <li><a href="{{ '/archive' | relative_url }}" class="nav-link" {% if page.url contains '/archive' %}aria-current="page"{% endif %}>归档</a></li>
        <li><a href="{{ '/projects' | relative_url }}" class="nav-link" {% if page.url contains '/projects' %}aria-current="page"{% endif %}>项目</a></li>
        <li><a href="{{ '/about' | relative_url }}" class="nav-link" {% if page.url contains '/about' %}aria-current="page"{% endif %}>关于</a></li>
        <li>
          <a href="{{ site.github_username | prepend: 'https://github.com/' }}" class="nav-link" target="_blank" rel="noopener" aria-label="GitHub（新窗口打开）">
            <span style="display:inline-flex;vertical-align:-2px;margin-right:6px;">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
              </svg>
            </span>
            GitHub
          </a>
        </li>
      </ul>
    </nav>

    <button class="mobile-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="mobile-nav">
      <span class="toggle-bar" aria-hidden="true"></span>
      <span class="toggle-bar" aria-hidden="true"></span>
      <span class="toggle-bar" aria-hidden="true"></span>
    </button>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航">
    <ul class="mobile-nav-list">
      <li><a href="{{ '/' | relative_url }}" class="mobile-nav-link">首页</a></li>
      <li><a href="{{ '/archive' | relative_url }}" class="mobile-nav-link">归档</a></li>
      <li><a href="{{ '/projects' | relative_url }}" class="mobile-nav-link">项目</a></li>
      <li><a href="{{ '/about' | relative_url }}" class="mobile-nav-link">关于</a></li>
      <li><a href="{{ site.github_username | prepend: 'https://github.com/' }}" class="mobile-nav-link" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </nav>
</header>

<script>
(function() {
  var toggle = document.querySelector('.mobile-toggle');
  var mobileNav = document.getElementById('mobile-nav');
  var body = document.body;

  if (toggle) {
    toggle.addEventListener('click', function() {
      var isExpanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', !isExpanded);
      toggle.setAttribute('aria-label', isExpanded ? '打开菜单' : '关闭菜单');
      mobileNav.classList.toggle('active');
      if (mobileNav.classList.contains('active')) {
        body.style.overflow = 'hidden';
        document.querySelector('.mobile-nav-link').focus();
      } else {
        body.style.overflow = '';
        toggle.focus();
      }
    });

    document.querySelectorAll('.mobile-nav-link').forEach(function(link) {
      link.addEventListener('click', function() {
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', '打开菜单');
        mobileNav.classList.remove('active');
        body.style.overflow = '';
      });
    });
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && mobileNav.classList.contains('active')) {
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', '打开菜单');
      mobileNav.classList.remove('active');
      body.style.overflow = '';
      toggle.focus();
    }
  });
})();
</script>
