        </svg>
        Email

      <!-- QQ 没有可靠的网页直达链接（wpa.qq.com/msgrd 那类老接口不保证可用），
           做成点击复制号码；号码同时显示在按钮上，长按也能选中。
           用 class 而不是 id 绑定：关于页在「联系我」和页脚各有一个，不能用重复 id。 -->
      <button type="button" class="social-btn js-qq-copy" data-qq="3554786480" aria-label="复制 QQ 号 3554786480">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M3.5 2.5h9a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H7.2l-3.4 2.9a.5.5 0 0 1-.83-.38V11.4A2 2 0 0 1 1.5 9.5v-5a2 2 0 0 1 2-2Z"/>
        </svg>
        <span class="js-qq-label">QQ 3554786480</span>
      </button>
      <!-- 抖音：与关于页同一套交互（悬停/聚焦浮出二维码）。
           用 .contact-pop 容器 + relative 定位，所以这里能直接复用。
           页脚在页面底部，卡片向上浮出（bottom: 100%），方向正好。 -->
      <span class="contact-pop">
        <button type="button" class="social-btn" aria-label="查看抖音二维码">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">

          </svg>
          抖音
        </button>

          <img class="contact-pop-qr" src="{{ '/assets/images/douyin.png' | relative_url }}"
               alt="抖音账号 Hesperus 的二维码" width="180" height="180"
               decoding="async">
          <span class="contact-pop-name">Hesperus</span>
          <span class="contact-pop-id">抖音号 84526083977</span>
        </span>
      </span>

    </p>
  </div>
</footer>

<script>
// 页脚里所有「点击复制 QQ 号」按钮。本站走 HTTP、不属于安全上下文，
// navigator.clipboard 在线上不可用，所以保留了 execCommand 兜底。
(function () {
  var buttons = document.querySelectorAll('.js-qq-copy');
  Array.prototype.forEach.call(buttons, function (btn) {
    var label = btn.querySelector('.js-qq-label') || btn;
    var qq = btn.getAttribute('data-qq');
    var original = label.textContent;
    var timer = 0;

    function flash(text) {
      label.textContent = text;
      clearTimeout(timer);
      timer = setTimeout(function () { label.textContent = original; }, 1600);
    }

    function legacyCopy() {
      var input = document.createElement('input');
      input.value = qq;
      input.setAttribute('readonly', 'readonly');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(input);
      flash(ok ? '已复制 ' + qq : 'QQ ' + qq + '（请长按复制）');
    }

    btn.addEventListener('click', function () {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(qq).then(function () {
          flash('已复制 ' + qq);
        }, legacyCopy);
      } else {
        legacyCopy();
      }
    });
  });
})();

// 「悬停出二维码」的入口（关于页的「联系我」与页脚各有一个）在触摸设备上的处理：
// 手机没有悬停，改为点击切换。桌面端不接管，交给 CSS 的 :hover / :focus-within。
// 放在页脚是为了全站共用一份，避免每个用到它的页面各写一遍。
(function () {
  if (!window.matchMedia('(hover: none)').matches) return;
  var pops = document.querySelectorAll('.contact-pop');
  Array.prototype.forEach.call(pops, function (pop) {
    var btn = pop.querySelector('button');
    if (!btn) return;
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var open = pop.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
})();
</script>
