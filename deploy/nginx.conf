# myblog1 静态博客站点 + 文件分享服务
# 由 deploy.py --setup 上传到服务器 /etc/nginx/sites-available/myblog1
server {
    listen 80 default_server;
    server_name 121.196.246.16 _;

    root /var/www/myblog1;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/myblog1.access.log;
    error_log  /var/log/nginx/myblog1.error.log;

    # 上传上限。刻意略大于文件服务的 MAX_FILE_MB(2048)，这样超限时由文件服务
    # 返回 JSON 格式的 413，而不是 nginx 自己的 HTML 错误页。两者需保持同步。
    client_max_body_size 2200m;
    client_body_timeout 3600s;

    # 静态站路由：精确文件 -> 目录 -> 补 .html -> 404
    #
    # HTML 用短缓存 + must-revalidate：页面本身没有内容哈希，改一篇文章内容不变名，
    # 所以不能长缓存，否则访客会长时间看到旧版。5 分钟足够挡住「同一访客连点几个页面」
    # 这类重复请求，又能在部署后很快生效。没有缓存时每次请求都要靠 ETag 往返一次
    # （304 虽小，但整站导航意味着每个页面一次往返）。
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---------- 文件分享服务 API（反代到本机 127.0.0.1:8000） ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件直接流式转发，不在 nginx 落盘缓冲
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 内部下载位置 ----------
    # 文件服务返回 X-Accel-Redirect 指向这里，由 nginx 直接发文件：
    # 支持 Range 断点续传与 sendfile，字节不经过 Python。
    # internal 保证外部无法直接构造 URL 绕过审核检查。
    #
    # 注意：nginx 处理 X-Accel-Redirect 时会用自己的静态文件元信息重建响应头
    # （Content-Type / Content-Length / Last-Modified / ETag / Accept-Ranges），
    # 并且不会把上游的 X-Content-Type-Options 带过来，所以这里补一条。
    # Content-Type 与 Content-Disposition 上游的值会被保留，不要在此重复 add_header，
    # 否则会出现重复响应头。
    location /__files/ {
        internal;
        alias /var/lib/myblog-files/storage/;
        add_header X-Content-Type-Options nosniff;
    }

    # 静态资源长缓存。
    # 只留 expires：expires 会自己生成 Cache-Control: max-age=2592000，
    # 再写一条 add_header Cache-Control 会把它整个顶掉，结果只剩 public、没有 max-age
    # （实测就是这个现象）。资源已按内容哈希加 ?v= 版本号，改名即失效，长缓存安全。
    location /assets/ {
        expires 30d;
    }

    # 压缩
    # text/html 必须显式列出：nginx 的 gzip_types 默认不含它，漏掉的话
    # 页面会以原始大小传输（实测首页 15.4KB 未压缩，gzip 后只要 5.8KB，省 62%）。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/html
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
