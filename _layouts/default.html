<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  {% seo %}
  {% feed_meta %}
  
  <!-- minima 主题样式（由 _sass/minima/custom-variables.scss 覆写为深色中性配色） -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- 站点设计系统（MiMo 风格：浅色暖底 + 小米橙点缀） -->
  <link rel="stylesheet" href="{{ '/assets/css/custom.css?v=2' | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="shortcut icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/favicon.svg' | relative_url }}">
  <meta name="theme-color" content="#f7f5f1">
  
  {% include custom-head.html %}
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  {% include header.html %}

  <main id="main-content" class="page-content" aria-label="内容">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <!-- 自定义光标（仅桌面鼠标设备，由 main.js 动态创建） -->
  <script src="{{ '/assets/js/main.js?v=2' | relative_url }}" defer></script>
</body>
</html>
