<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  {% seo %}
  {% feed_meta %}
  
  <!-- 全站样式统一由 custom.css 管理。
       这里原本还有一行 minima 主题的 style.css：它只在 GitHub Pages 上由 Jekyll
       编译 assets/css/style.scss 生成，自建服务器这条构建路径不产出该文件，
       导致每个页面都发一次 404 请求。既然站点所有可见样式（含文章正文内的
       表格、引用、代码块）都已由 custom.css 覆盖，就不加载它了，
       两条构建路径的产物因此完全一致。 -->
  <link rel="stylesheet" href="{{ '/assets/css/custom.css?v=6' | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="shortcut icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/favicon.svg' | relative_url }}">
  <meta name="theme-color" content="#f7f5f1">
  
  {% include custom-head.html %}
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  {% include header.html %}

  <main id="main-content" class="page-content" aria-label="内容">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <!-- 自定义光标（仅桌面鼠标设备，由 main.js 动态创建） -->
  <script src="{{ '/assets/js/main.js?v=2' | relative_url }}" defer></script>
  <!-- 首页黑洞动画（只在存在 .hero-visual canvas 的页面生效） -->
  <script src="{{ '/assets/js/blackhole.js?v=1' | relative_url }}" defer></script>
  <!-- 页眉轮换名言 / 古诗词 -->
  <script src="{{ '/assets/js/quote.js?v=1' | relative_url }}" defer></script>
</body>
</html>
